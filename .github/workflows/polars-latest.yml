name: Newest polars
# Fresh installs resolve the newest polars, but the other test workflows use
# the locked one. Not a required check: a polars release must not block PRs.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "packages/*/pyproject.toml"
      - ".github/workflows/polars-latest.yml"
concurrency:
  group: ci-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  native:
    uses: ./.github/workflows/native-wheels.yml

  test:
    name: Test ${{ matrix.package }} (newest polars)
    needs: native
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [svy, svy-io, svy-rs]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "latest"
          python-version: "3.14"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-wheels
          path: wheels
      - name: Install deps
        run: |
          uv sync --all-packages --no-install-package svy-rs --no-install-package svy-io
          uv pip install --python .venv --no-deps wheels/*/*.whl
          uv pip install --python .venv --upgrade "polars[pyarrow]"
          .venv/bin/python -c "import polars; print('polars', polars.__version__)"
      - name: Run tests
        env:
          UV_NO_SYNC: "1"  # a sync would rebuild svy-rs and svy-io from source
        run: make test-${{ matrix.package }}
