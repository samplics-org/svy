name: Build and Publish svy Wheels

on:
  push:
    tags:
      - "svy-v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      publish_testpypi:
        type: boolean
        description: Upload to TestPyPI
        default: false
      publish_pypi:
        type: boolean
        description: Upload to PyPI
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build svy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Verify tag matches the committed version and CHANGELOG
        if: startsWith(github.ref, 'refs/tags/svy-v')
        run: >
          python .github/scripts/release_notes.py
          --package svy
          --tag "${{ github.ref_name }}"
          --out /dev/null
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "latest"
          enable-cache: false
      - name: Build sdist and wheel
        run: uv build --package svy
      - name: List artifacts
        run: ls -lh dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/*

  publish:
    name: Publish to PyPI
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/svy-v') || inputs.publish_pypi || inputs.publish_testpypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment:
      name: ${{ (startsWith(github.ref, 'refs/tags/svy-v') || inputs.publish_pypi) && 'pypi' || 'testpypi' }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: List artifacts
        run: ls -lh dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist
          skip-existing: true

  release:
    name: GitHub Release
    needs: [publish]
    # Tag pushes only — a workflow_dispatch to TestPyPI is a rehearsal and should
    # not leave a release page behind.
    if: startsWith(github.ref, 'refs/tags/svy-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Extract release notes from CHANGELOG
        run: >
          python .github/scripts/release_notes.py
          --package svy
          --tag "${{ github.ref_name }}"
          --out release-notes.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >
          gh release create "$TAG"
          --title "svy ${TAG#svy-v}"
          --notes-file release-notes.md
          --verify-tag
