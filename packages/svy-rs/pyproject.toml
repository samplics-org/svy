[project]
name = "svy_rs"
version = "0.18.1"
description = "Internal Rust extension for the svy package. Do not depend on this directly."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Samplics LLC", email = "msdiallo@samplics.org" }]
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Development Status :: 4 - Beta",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering",
]
dependencies = [
    "polars[pyarrow]>=2.0.0",
]

[project.urls]
Homepage = "https://svylab.com/docs/svy"
Source = "https://github.com/samplics-org/svy"
Repository = "https://github.com/samplics-org/svy"
Issues = "https://github.com/samplics-org/svy/issues"

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
module-name = "svy_rs._internal"
python-source = "."
features = ["pyo3/extension-module"]

# uv rebuilds a local package only when a cache key changes; without the Rust
# sources here, a Rust edit leaves a stale extension in the venv.
[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "Cargo.toml" },
  { file = "Cargo.lock" },
  { file = "src/**/*.rs" },
]
