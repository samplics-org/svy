[package]
name = "svy-core"
version = "0.20.0"
edition = "2024"
rust-version = "1.91"
repository = "https://github.com/samplics-org/svy"
homepage = "https://svylab.com/docs/svy"
publish = false

[dependencies]
faer = "0.24"
# Must be the ndarray the bindings' numpy accepts; see ../Cargo.toml.
ndarray = { version = "0.17", features = ["rayon"] }
# The bindings add the small-int dtypes they need to import frames.
polars = { version = "0.55", default-features = false, features = ["dtype-categorical"] }
rayon = "1.12"
rustc-hash = "2.1"
thiserror = "2.0"

[dev-dependencies]
approx = "0.5.1"
criterion = { version = "0.8", features = ["html_reports"] }

# Criterion micro-benchmarks of the estimation kernels, free of Python/PyO3 marshalling:
#   cargo bench -p svy-core   (or `make bench-svy-rs`)
# Measures string vs integer design indexing, fused point estimates and variance passes.
[[bench]]
name = "kernel_bench"
harness = false
