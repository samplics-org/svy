[package]
name = "svy_rs"
version = "0.21.0"
edition = "2024"
# polars calls i64::strict_abs (strict_overflow_ops, stable since 1.91) and
# declares no rust-version of its own, so without this the failure on an older
# toolchain is a raw E0658 inside polars-core rather than an MSRV error.
rust-version = "1.91"
repository = "https://github.com/samplics-org/svy"
homepage = "https://svylab.com/docs/svy"

# svy-core holds the kernels in plain Rust; this crate is only their Python binding.
[workspace]
members = ["core"]
# Plain `cargo test`/`clippy` here (CI, `make test-svy-rs-cargo`) cover both crates.
default-members = [".", "core"]

[lib]
name = "_internal"
# cdylib: the Python extension module (what maturin builds into the wheel).
# rlib:   lets `cargo test` link the crate as an ordinary Rust library.
crate-type = ["cdylib", "rlib"]

[dependencies]
svy-core = { path = "core" }
# `extension-module` is intentionally NOT listed here — it is pulled in only
# through this crate's own `extension-module` feature (default-on, and also
# passed explicitly by maturin via pyproject.toml). Keeping it off the direct
# dependency lets host builds drop it with `--no-default-features`, so
# `cargo test`/`cargo bench` link a normal binary instead of failing on
# undefined libpython symbols. See the [features] section below.
pyo3 = { version = "0.29", features = ["abi3-py311", "generate-import-lib"] }
pyo3-polars = { version = "0.28", features = ["derive"] }
# Without the small-int dtypes, pyo3-polars cannot import a frame holding an
# Int8/Int16/UInt8/UInt16 column (e.g. a Stata byte), whatever its role.
polars = { version = "0.55", default-features = false, features = [
    "dtype-categorical",
    "dtype-i8",
    "dtype-i16",
    "dtype-u8",
    "dtype-u16",
] }
numpy = "0.29"
# Must stay within what numpy accepts (`>= 0.15, <=0.17`): a bump past that
# range leaves two ArrayBase types in one graph and every ndarray-typed call
# fails to typecheck. Verify a single ndarray entry in Cargo.lock after bumping.
ndarray = { version = "0.17", features = ["rayon"] }
rayon = "1.12"

[features]
extension-module = ["pyo3/extension-module"]
default = ["extension-module"]

# The kernels sit in svy-core: without LTO, code instantiated across the crate boundary loses inlining.
[profile.release]
lto = "thin"
