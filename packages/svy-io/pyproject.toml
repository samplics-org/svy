[project]
name = "svy-io"
version = "0.3.0"
description = "SAS/SPSS/Stata I/O with Polars, powered by ReadStat + PyO3"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Samplics LLC" }]
classifiers = [
  "License :: OSI Approved :: MIT License",
]
requires-python = ">=3.11"
dependencies = ["polars[pyarrow]>=1.34.0"]

[project.urls]
homepage = "https://svylab.com/docs/svy-io"

[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[tool.maturin]
bindings = "pyo3"
module-name = "svy_io.svyreadstat_rs"
manifest-path = "native/svyreadstat_rs/Cargo.toml"
python-source = "python"
python-packages = ["svy_io"]
include = [
  "native/readstat-sys/build.rs",
  "native/readstat-sys/wrapper.h",
  "ReadStat/src/**/*",
  "ReadStat/LICENSE",
  "ReadStat/README.md",
]
features = ["vendored"]

[dependency-groups]
dev = [
    "maturin>=1.9.4",
    "pytest>=8.4.2",
    "pytest-benchmark>=4.0.0",
    "pytest-cov>=6.0.0",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
# An xfail that starts passing is a failure. Without this, XPASS is printed and
# ignored, so a marker outlives the limitation it describes: three of them had,
# still claiming features unsupported that this package has shipped for releases.
xfail_strict = true

# A deprecation is an API this package is scheduled to lose, so it should break a
# test run rather than scroll past in a warnings summary: `ordering=` on
# pl.Categorical printed here for releases while silently doing nothing.
#
# Do NOT narrow this to `error::DeprecationWarning:polars`. The module field is
# matched against the frame the warning is attributed to, and polars sets
# stacklevel to point at *our* code, so `:polars` never matches and the filter
# silently does nothing. Verified with a probe against both forms.
filterwarnings = [
    "error::DeprecationWarning",
]

# Benchmark configuration
[tool.pytest-benchmark]
# Only run benchmarks when --benchmark-only is specified
disable_gc = true
min_rounds = 5
warmup = true
warmup_iterations = 2

[tool.ruff]
line-length = 99
target-version = "py313"
src = ["src", "tests"]
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["D", "E", "F", "W", "I001"]
ignore = ["D", "E501"]  # for development we can ignore the docs
exclude = [".venv", "tests"]

[tool.ruff.lint.pycodestyle]
ignore-overlong-task-comments = true

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["svy"]
known-third-party = [
    "numpy",
    "pandas",
    "polars",
]
lines-after-imports = 2
lines-between-types = 1

[tool.ty.rules]
unused-ignore-comment = "ignore"
division-by-zero = "error"

[tool.ty.environment]
python = "./.venv"
